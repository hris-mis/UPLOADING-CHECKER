<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sched Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="p-4 sm:p-6 lg:p-8">
  <div class="max-w-[1400px] mx-auto">
    <header class="mb-10 text-center rounded-2xl shadow-lg p-8 sm:p-12 text-white relative overflow-hidden">
      <div class="absolute inset-0 bg-slate-800/50 z-0"></div>
      <div class="relative z-10">
        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tight">Sched Master</h1>
        <p class="mt-4 text-lg sm:text-xl text-slate-200">Your intelligent schedule conflict checker.</p>
      </div>
    </header>
    <nav class="flex justify-center space-x-4 mb-8" aria-label="Schedule groups">
      <button id="tab-operation" class="tab-btn active" type="button">
        <svg class="group-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 3v4m10-4v4M6 11h4v4H6zM5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
        <span>Operation Group</span>
      </button>
      <button id="tab-support" class="tab-btn" type="button">
        <svg class="group-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.2c0 4.6 3.2 8.1 7.5 9.8 4.3-1.7 7.5-5.2 7.5-9.8V6L12 3Zm-3 9 2 2 4-4"/></svg>
        <span>Support Group</span>
      </button>
    </nav>
    <section id="panel-operation" aria-labelledby="tab-operation">
      <iframe class="checker-frame" title="Operation Group conflict checker" src="checker.html?group=operation"></iframe>
    </section>
    <section id="panel-support" class="hidden" aria-labelledby="tab-support">
      <iframe class="checker-frame" title="Support Group conflict checker" data-src="checker.html?group=support"></iframe>
    </section>
  </div>
  <script src="tabs.js"></script>
</body>
</html>
